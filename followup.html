<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>صفحة المتابعة - د. ريمون لطفي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f3f6f5; --card:#fff; --ink:#16302b; --muted:#6b7f7a; --line:#dfe8e5; --teal:#1f7a6a; --teal-soft:#e3f3ef; --amber:#ff9500; --red:#e0453a; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Tajawal','Cairo',system-ui,sans-serif; font-size:16px; line-height:1.7; padding-bottom:96px; }
  .wrap{ max-width:640px; margin:0 auto; padding:0 14px; }
  header{ background:linear-gradient(135deg,#1f7a6a,#2b9a86); color:#fff; padding:22px 14px 56px; }
  header .wrap{ padding:0; }
  header small{ opacity:.85; font-size:13px; display:block; }
  header h1{ margin:2px 0 0; font-family:'Cairo',sans-serif; font-size:23px; }
  header .pname{ margin-top:10px; font-size:17px; font-weight:700; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-top:14px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .lift{ margin-top:-38px; }
  h2{ font-family:'Cairo',sans-serif; font-size:17px; margin:0 0 10px; }
  .now small{ color:var(--muted); }
  .now .big{ font-family:'Cairo',sans-serif; font-size:21px; font-weight:800; color:var(--teal); }
  .bar{ height:10px; border-radius:6px; background:var(--teal-soft); overflow:hidden; margin:10px 0 4px; }
  .bar i{ display:block; height:100%; background:var(--teal); border-radius:6px; }
  .txt{ white-space:pre-wrap; }
  .chips{ display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .pchip{ flex:0 0 auto; border:1px solid var(--line); background:#fff; border-radius:20px; padding:5px 14px; font-family:'Cairo',sans-serif; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer; }
  .pchip.on{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .tlwrap{ background:linear-gradient(180deg,#fff,#eef3f2); border:1px solid var(--line); border-radius:18px; margin-top:6px; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
  .track{ position:relative; display:flex; flex-direction:row; width:max-content; padding:0 18px; direction:rtl; }
  .track::before{ content:''; position:absolute; left:0; right:0; top:164px; height:3px; background:#2f3d46; border-radius:2px; }
  .node{ --c:#8E8E93; position:relative; width:92px; height:328px; flex:0 0 auto; cursor:pointer; user-select:none; }
  .node .dot{ position:absolute; left:50%; top:157px; transform:translateX(-50%); width:16px; height:16px; border-radius:50%; background:#2f3d46; border:3px solid var(--c); z-index:2; }
  .node .stem{ position:absolute; left:50%; width:2px; background:#2f3d46; transform:translateX(-50%); }
  .node.up .stem{ top:78px; height:80px; }
  .node.dn .stem{ top:172px; height:80px; }
  .node .ball{ position:absolute; left:50%; transform:translateX(-50%); width:64px; height:64px; border-radius:50%; background:#fff; border:5px solid #323f48; box-shadow:0 3px 8px rgba(0,0,0,.25); display:flex; align-items:center; justify-content:center; z-index:2; transition:transform .15s; }
  .node.up .ball{ top:14px; }
  .node.dn .ball{ bottom:14px; }
  .node .ball i{ font-style:normal; width:48px; height:48px; border-radius:50%; background:var(--c); color:#fff; font-family:'Cairo',sans-serif; font-weight:800; font-size:20px; display:flex; align-items:center; justify-content:center; }
  .node .lab{ position:absolute; left:4px; right:4px; text-align:center; font-size:11px; line-height:1.35; color:var(--muted); }
  .node .lab b{ display:inline-block; background:#323f48; color:#fff; border-radius:4px; padding:0 6px; font-size:11px; margin-bottom:2px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .node.up .lab{ top:84px; }
  .node.dn .lab{ top:204px; }
  .node.sel .ball{ transform:translateX(-50%) scale(1.14); }
  .node.sel .dot{ background:var(--c); }
  .node.past .ball i::after{ content:'✓'; position:absolute; right:-2px; top:-2px; width:20px; height:20px; border-radius:50%; background:#34C759; color:#fff; font-size:12px; line-height:20px; text-align:center; border:2px solid #fff; }
  .node.past .ball{ position:absolute; }
  .node.cur .ball{ animation:pulse 1.8s infinite; }
  .node.fut{ --c:#aab3b8; }
  .node.fut .ball{ filter:grayscale(1); opacity:.75; }
  .node.fut .lab{ opacity:.6; }
  .node.fut .dot{ background:#aab3b8; border-color:#c9d0d3; }
  .locked{ text-align:center; padding:18px 6px; color:var(--muted); }
  .locked .lk{ font-size:34px; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(255,149,0,.55);} 70%{ box-shadow:0 0 0 12px rgba(255,149,0,0);} 100%{ box-shadow:0 0 0 0 rgba(255,149,0,0);} }
  .detail{ border-right:6px solid var(--c,#1f7a6a); }
  .detail .dh{ font-family:'Cairo',sans-serif; font-weight:800; font-size:18px; }
  .detail .ds{ color:var(--muted); font-size:13px; margin-bottom:8px; }
  .detail h3{ font-family:'Cairo',sans-serif; font-size:15px; margin:14px 0 4px; }
  .med{ padding:10px 0; border-bottom:1px solid var(--line); }
  .med:last-child{ border:0; }
  .med b{ display:block; }
  .med span{ color:var(--muted); font-size:14px; }
  .empty{ color:var(--muted); text-align:center; padding:30px 10px; }
  #askBtn{ position:fixed; bottom:calc(16px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:20; background:var(--teal); color:#fff; border:0; border-radius:30px; padding:14px 26px; font-family:'Cairo',sans-serif; font-size:16px; font-weight:700; box-shadow:0 6px 18px rgba(31,122,106,.4); cursor:pointer; }
  #askBtn b{ background:var(--red); border-radius:10px; padding:0 7px; margin-right:6px; font-size:13px; }
  #chat{ position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.4); display:none; align-items:flex-end; justify-content:center; }
  #chat.on{ display:flex; }
  #chat .sheet{ background:#fff; width:100%; max-width:640px; height:82vh; border-radius:22px 22px 0 0; display:flex; flex-direction:column; }
  #chat .top{ display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); font-family:'Cairo',sans-serif; font-weight:800; }
  #chat .top button{ border:0; background:var(--bg); width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer; }
  #msgs{ flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; background:var(--bg); }
  .m{ max-width:82%; padding:9px 13px; border-radius:16px; white-space:pre-wrap; word-break:break-word; }
  .m small{ display:block; font-size:11px; opacity:.65; margin-top:3px; }
  .m.me{ align-self:flex-start; background:var(--teal); color:#fff; border-bottom-right-radius:4px; }
  .m.dr{ align-self:flex-end; background:#fff; border:1px solid var(--line); border-bottom-left-radius:4px; }
  #send{ display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  #send textarea{ flex:1; resize:none; height:46px; border:1px solid var(--line); border-radius:14px; padding:10px 12px; font-family:inherit; font-size:16px; }
  #send button{ border:0; background:var(--teal); color:#fff; border-radius:14px; padding:0 20px; font-family:'Cairo',sans-serif; font-weight:700; font-size:15px; cursor:pointer; }
  #send button:disabled{ opacity:.5; }
  #hint{ font-size:12px; color:var(--muted); padding:0 14px 6px; }
  .note{ font-size:13px; color:var(--muted); text-align:center; margin:22px 10px 0; }
</style>
</head>
<body>
<header><div class="wrap">
  <small>د. ريمون لطفي — جراحة العظام</small>
  <h1>صفحة المتابعة</h1>
  <div class="pname" id="pname"></div>
</div></header>
<div class="wrap" id="app"><div class="card lift empty">جاري التحميل...</div></div>

<button id="askBtn" style="display:none;">💬 استفسار للدكتور</button>
<div id="chat"><div class="sheet">
  <div class="top"><span>💬 استفسار للدكتور</span><button id="chatClose">✕</button></div>
  <div id="msgs"></div>
  <div id="hint">اكتب سؤالك وهيرد عليك الدكتور هنا. في الحالات الطارئة اتصل بالعيادة أو روح أقرب طوارئ.</div>
  <div id="send"><textarea id="txt" placeholder="اكتب استفسارك..." maxlength="1000"></textarea><button id="sendBtn">إرسال</button></div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import { getFirestore, doc, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyApOfA6TvzUbYLd5IXF-sAVXCzv3s-TUsw",
  authDomain: "clinic-remonlotfy.firebaseapp.com",
  projectId: "clinic-remonlotfy",
  storageBucket: "clinic-remonlotfy.firebasestorage.app",
  messagingSenderId: "187649934520",
  appId: "1:187649934520:web:52a1a5648ec6b51466204d"
});
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token = new URLSearchParams(location.search).get('t') || '';
const DAY = 86400000;
let D = null, msgs = [], chatOpen = false, seen = 0;

function fmt(d){ return d.toLocaleDateString('ar-EG', { day:'numeric', month:'long' }); }
function parseDate(s){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function phaseOf(phases, w){ return phases.find(p => w >= p.from && w <= p.to) || null; }

const COLORS = ['#a24fc0','#ff9f1a','#19b3cf','#43b05c','#ff6a3d','#e8579a'];
let selW = 0;
function calc(){
  const phases = (D.phases || []).map(p => ({ name: p.name || '', from: +p.from || 1, to: +p.to || +p.from || 1, text: p.text || '' })).sort((a, b) => a.from - b.from);
  let total = +D.total || 0;
  if(D.weeks) total = Math.max(total, ...Object.keys(D.weeks).map(Number), 0);
  total = Math.max(total, phases.reduce((m, p) => Math.max(m, p.to), 0));
  const start = parseDate(D.startDate);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const cur = start ? Math.floor((today - start) / (7 * DAY)) + 1 : 0;
  return { phases, total, start, cur };
}
function wTitle(w){ const v = D.weeks && D.weeks[w]; return (v && v.title) || ''; }
function detailHtml(w){
  const { phases, total, start, cur } = calc();
  const ph = phaseOf(phases, w), c = COLORS[(w - 1) % COLORS.length];
  const ws = start ? new Date(start.getTime() + (w - 1) * 7 * DAY) : null, we = ws ? new Date(ws.getTime() + 6 * DAY) : null;
  if(start && w > cur){
    return `<div class="card detail" style="--c:#aab3b8"><div class="dh">الأسبوع ${w}${wTitle(w) ? ' — ' + esc(wTitle(w)) : ''}</div>
      <div class="locked"><div class="lk">🔒</div><div><b>الأسبوع ده لسه مجاش</b></div><div>هتظهر تعليماته وأدويته يوم ${ws ? esc(fmt(ws)) : 'بدايته'}.</div></div></div>`;
  }
  const wd = (D.weeks && D.weeks[w]) || null;
  const meds = ((wd && wd.meds) ? wd.meds : (D.meds || [])).filter(m => m && m.name);
  return `<div class="card detail" style="--c:${c}">
    <div class="dh">الأسبوع ${w}${wTitle(w) ? ' — ' + esc(wTitle(w)) : ''}</div>
    <div class="ds">${ws ? esc(fmt(ws)) + ' – ' + esc(fmt(we)) : ''}${start && w === cur ? ' · 📍 إحنا هنا دلوقتي' : ''}${start && w < cur ? ' · ✓ خلص' : ''}</div>
    <h3>📌 التعليمات</h3>
    <div class="txt">${esc((wd && wd.text) ? wd.text : (ph && ph.text ? ph.text : 'مفيش تعليمات إضافية للأسبوع ده.'))}</div>
    <h3>💊 الأدوية</h3>
    ${meds.length ? meds.map(m => `<div class="med"><b>${esc(m.name)}</b>${m.instructions ? `<span>${esc(m.instructions)}</span>` : ''}</div>`).join('') : `<div class="empty" style="padding:6px;">مفيش أدوية مسجلة دلوقتي.</div>`}
  </div>`;
}
function selectWeek(w, scroll){
  selW = w;
  document.querySelectorAll('.node').forEach(n => n.classList.toggle('sel', +n.dataset.w === w));
  const box = $('detail'); if(box) box.innerHTML = detailHtml(w);
  if(scroll){ const n = document.querySelector(`.node[data-w="${w}"]`); if(n) n.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' }); }
}
function render(){
  if(!D){ return; }
  $('pname').textContent = D.name || '';
  const { phases, total, start, cur } = calc();
  let html = '';
  if(!total){
    html += `<div class="card lift now"><div class="big">${esc(D.title || 'متابعتك')}</div><small>لسه مفيش جدول متابعة. الدكتور هيضيفه قريب.</small></div>`;
  }else{
    let head;
    if(start && cur < 1) head = `<small>المتابعة هتبدأ يوم</small><div class="big">${esc(fmt(start))}</div>`;
    else if(start && cur > total) head = `<small>${esc(D.title || 'المتابعة')}</small><div class="big">⏳ في انتظار تعليمات الأسبوع ${cur}</div><small>الدكتور هيضيفها قريب. لو عندك أي استفسار ابعته من الزرار تحت.</small>`;
    else if(start) head = `<small>${esc(D.title || 'المتابعة')}</small><div class="big">الأسبوع ${cur} من ${total}</div><div class="bar"><i style="width:${Math.round((cur - 1) / total * 100)}%"></i></div>`;
    else head = `<small>${esc(D.title || 'المتابعة')}</small><div class="big">${total} أسبوع</div>`;
    html += `<div class="card lift now">${head}<small>دوس على أي رقم تحت علشان تشوف تعليمات الأسبوع والأدوية 👇</small></div>`;
    html += `<div class="tlwrap" id="tlwrap"><div class="track">`;
    for(let w = 1; w <= total; w++){
      const ph = phaseOf(phases, w), c = COLORS[(w - 1) % COLORS.length], up = w % 2 === 1;
      const ws = start ? new Date(start.getTime() + (w - 1) * 7 * DAY) : null;
      const cls = (up ? 'up' : 'dn') + (start ? (w < cur ? ' past' : (w === cur ? ' cur' : ' fut')) : '');
      html += `<div class="node ${cls}" data-w="${w}" style="--c:${c}"><div class="stem"></div><div class="dot"></div>
        <div class="ball"><i>${String(w).padStart(2, '0')}</i></div>
        <div class="lab"><b>${esc(wTitle(w) || 'الأسبوع ' + w)}</b>${ws ? '<br>' + esc(fmt(ws)) : ''}</div></div>`;
    }
    html += `</div></div><div id="detail"></div>`;
  }
  if(D.note){ html += `<div class="card"><h2>📝 ملاحظات</h2><div class="txt">${esc(D.note)}</div></div>`; }
  html += `<div class="note">الصفحة دي خاصة بيك ومتحدثة من الدكتور. متشاركش الرابط مع حد.</div>`;
  $('app').innerHTML = html;
  $('askBtn').style.display = D.msgUrl ? '' : 'none';
  if(total){
    document.querySelectorAll('.node').forEach(n => n.onclick = ()=> selectWeek(+n.dataset.w, false));
    const first = (start && cur >= 1) ? Math.min(cur, total) : (selW && selW <= total ? selW : 1);
    selectWeek(first, false);
    if(!render.done){ render.done = true; setTimeout(()=>{ const n = document.querySelector(`.node[data-w="${first}"]`); if(n) n.scrollIntoView({ inline:'center', block:'nearest' }); }, 150); }
  }
}

function renderMsgs(){
  const box = $('msgs');
  box.innerHTML = msgs.length ? msgs.map(m => `<div class="m ${m.from === 'doctor' ? 'dr' : 'me'}">${esc(m.text)}<small>${m.from === 'doctor' ? 'الدكتور' : 'أنت'}${m.at ? ' · ' + m.at.toDate().toLocaleString('ar-EG', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' }) : ''}</small></div>`).join('')
    : `<div class="empty">ابعت أول استفسار ليك 👇</div>`;
  box.scrollTop = box.scrollHeight;
  const unseen = msgs.filter(m => m.from === 'doctor').length;
  if(chatOpen){ seen = unseen; }
  const n = Math.max(0, unseen - seen);
  $('askBtn').innerHTML = '💬 استفسار للدكتور' + (n ? `<b>${n}</b>` : '');
}

if(!/^[a-z0-9]{20,40}$/.test(token)){
  $('app').innerHTML = `<div class="card lift empty">الرابط غير صحيح. اطلب من العيادة رابط جديد.</div>`;
}else{
  try{ seen = +localStorage.getItem('fuSeen_' + token) || 0; }catch(_){}
  onSnapshot(doc(db, 'followups', token), snap => {
    if(!snap.exists()){ $('app').innerHTML = `<div class="card lift empty">الصفحة دي غير متاحة. اطلب من العيادة رابط جديد.</div>`; return; }
    D = snap.data(); render();
  }, (err) => { $('app').innerHTML = `<div class="card lift empty">الصفحة دي غير متاحة أو اتوقفت. اطلب من العيادة رابط جديد.<div style="font-size:11px;direction:ltr;margin-top:10px;opacity:.7;">${esc((err && err.code) || 'error')}</div></div>`; });
  onSnapshot(query(collection(db, 'followups', token, 'messages'), orderBy('at')), snap => {
    msgs = snap.docs.map(d => d.data()); renderMsgs();
  }, () => {});
}

$('askBtn').onclick = ()=>{ chatOpen = true; $('chat').classList.add('on'); renderMsgs(); try{ localStorage.setItem('fuSeen_' + token, String(seen)); }catch(_){} setTimeout(()=> $('txt').focus(), 200); };
$('chatClose').onclick = ()=>{ chatOpen = false; $('chat').classList.remove('on'); try{ localStorage.setItem('fuSeen_' + token, String(seen)); }catch(_){} };
$('sendBtn').onclick = async ()=>{
  const text = $('txt').value.trim();
  if(!text || !D || !D.msgUrl) return;
  const b = $('sendBtn'); b.disabled = true; b.textContent = '...';
  try{
    const r = await fetch(D.msgUrl, { method:'POST', body: JSON.stringify({ action:'fuMessage', token, text }) });
    const j = await r.json();
    if(j.error){ alert(j.error); } else { $('txt').value = ''; }
  }catch(e){ alert('تعذر الإرسال، تأكد من النت وجرب تاني'); }
  b.disabled = false; b.textContent = 'إرسال';
};
</script>
</body>
</html>
