<style>
:root {

  --pri: #0f6e8c; --pri-2: #e6f2f6; --pri-ink: #fff; --ok: #1e7b4f; --ok-bg: #e5f4ec;

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Cairo', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; font-size: 15px; }
button, input, select, textarea { font: inherit; color: inherit; }
.loading { padding: 60px; text-align: center; color: var(--ink2); }

.top-row { display: flex; align-items: center; gap: 10px; padding: 8px 14px; max-width: 1200px; margin: auto; }
.top h1 { font-size: 17px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .who { font-size: 13px; opacity: .9; }
.top .ghost { background: rgba(255,255,255,.15); border: 0; color: #fff; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.tabs { display: flex; gap: 4px; padding: 0 10px; max-width: 1200px; margin: auto; overflow-x: auto; scrollbar-width: none; }
.tabs button { background: none; border: 0; color: rgba(255,255,255,.8); padding: 9px 12px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; font-weight: 600; }
.tabs button.on { color: #fff; border-bottom-color: #fff; }
.demo-bar { background: var(--warn-bg); color: var(--warn); text-align: center; font-size: 13px; padding: 5px; }

main { max-width: 1200px; margin: auto; padding: 14px; }
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; }
.card h3 { margin: 0 0 10px; font-size: 15px; color: var(--pri); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .lbl { font-size: 13px; color: var(--ink2); font-weight: 600; }
.req::after { content: ' *'; color: var(--bad); }
input[type=text], input[type=password], input[type=date], input[type=time], input[type=search], select, textarea {
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background: #fff; width: 100%; min-height: 42px;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--pri); outline-offset: -1px; border-color: var(--pri); }
textarea { min-height: 70px; resize: vertical; }
.hint { font-size: 12px; color: var(--muted); }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; cursor: pointer; min-height: 38px; }
.chip.on { background: var(--pri); border-color: var(--pri); color: #fff; font-weight: 600; }
.chip.on.ok { background: var(--ok); border-color: var(--ok); }
.chip.on.bad { background: var(--warn); border-color: var(--warn); }

/* Tag input */
.tags { position: relative; }
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.tag { background: var(--pri-2); color: var(--pri); border-radius: 8px; padding: 5px 10px; display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }
.tag button { border: 0; background: none; color: var(--pri); cursor: pointer; font-size: 17px; line-height: 1; padding: 0; }
.tag-row { display: flex; gap: 6px; }
.sugg { position: absolute; inset-inline: 0; top: 100%; z-index: 15; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.12); max-height: 260px; overflow: auto; margin-top: 4px; }
.sugg button { display: block; width: 100%; text-align: start; border: 0; background: none; padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
.sugg button:hover, .sugg button.active { background: var(--pri-2); }
.sugg .new { color: var(--pri); font-weight: 600; }

/* Buttons */

.btn.sec { background: var(--pri-2); color: var(--pri); }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.sm { padding: 6px 12px; min-height: 34px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.save-bar { position: sticky; bottom: 0; background: rgba(244,246,249,.96); padding: 10px 0; display: flex; gap: 8px; z-index: 10; }
.save-bar .btn { flex: 1; font-size: 16px; }
.errors { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; }
.errors ul { margin: 4px 0 0; padding-inline-start: 18px; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
th { color: var(--ink2); font-weight: 600; font-size: 13px; background: #fafbfc; position: sticky; top: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: #f8fafc; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.bad { background: var(--warn-bg); color: var(--warn); }
.sub { color: var(--muted); font-size: 12px; }
.empty { text-align: center; color: var(--muted); padding: 30px; }
.cards-m { display: none; }

  .cards-m { display: block; }

  main { padding: 10px; }

.details dt { color: var(--ink2); font-size: 13px; }
.details dd { margin: 0; font-weight: 600; }

.kpi .v { font-size: 26px; font-weight: 700; }
.kpi .k { font-size: 13px; color: var(--ink2); }

#print { display: none; }
@media print {

  body { background: #fff; font-size: 11px; }
  #app, .modal, .toast { display: none !important; }
  #print { display: block; }
  #print h2 { margin: 0 0 4px; font-size: 16px; }
  #print .meta { margin-bottom: 8px; color: #444; }
  #print table { font-size: 10px; }
  #print th { background: #eee !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; position: static; }
  #print th, #print td { border: 1px solid #999; padding: 4px; }
  #print h3 { margin: 10px 0 4px; font-size: 13px; }
  #print tr { page-break-inside: avoid; }
  #print .sig { display: flex; justify-content: space-around; gap: 20px; margin-top: 28px; page-break-inside: avoid; }
  #print .sig-box { display: flex; flex-direction: column; gap: 14px; text-align: center; font-size: 12px; }
  #print .sig-box b { font-size: 13px; }
}

    <div class="lbl" style="margin-top:12px">أنواع التخدير</div>${listEditor("anesthesiaTypes")}
  </div></details>
  <details class="set" data-k="fin" ${o("fin")}><summary>المعاملات المالية وجهات التعاقد</summary><div class="in">
    ${finRows}
    <form class="le-add" id="fin-add" style="margin-bottom:14px"><input type="text" placeholder="نوع معاملة جديد"><button class="btn sm">إضافة</button></form>
    <div class="lbl">جهات التعاقد</div>${listEditor("contractEntities", "اسم الجهة")}
  </div></details>
  <details class="set" data-k="comp" ${o("comp")}><summary>الشركات الخارجية والمستلزمات</summary><div class="in">
    <div class="lbl">الشركات</div>${listEditor("companies", "اسم الشركة")}
    <div class="lbl" style="margin-top:12px">أنواع المستلزمات</div>${listEditor("supplyTypes")}
  </div></details>
  <details class="set" data-k="loc" ${o("loc")}><summary>قادم من / خروج إلى</summary><div class="in">${listEditor("locations", "دور / قسم")}</div></details>
  <details class="set" data-k="pp" ${o("pp")}><summary>أسباب التأجيل</summary><div class="in">${listEditor("postponeReasons", "سبب")}</div></details>
  <details class="set" data-k="required" ${o("required")}><summary>الخانات الإجبارية في التسجيل</summary><div class="in">
    <p class="hint">علّم على الخانة اللي لازم تتملي قبل الحفظ. اليوم واسم المريض وتمت/تأجيل إجبارية دايمًا.</p>
    <div class="req-list">${REQUIRABLE_FIELDS.map(([k, label]) => `<label class="req-item"><input type="checkbox" data-reqf="${k}" ${settings.required[k] ? "checked" : ""}><span>${esc(label)}</span><b>${settings.required[k] ? "إجباري" : "اختياري"}</b></label>`).join("")}</div>
  </div></details>
  <details class="set" data-k="learned" ${o("learned")}><summary>تشخيصات وعمليات أضافها المستخدمون (${learned.length})</summary><div class="in">
    <p class="hint">تظهر كاقتراحات أثناء الكتابة. ⇧ لنقلها للقائمة الرسمية، × لحذفها.</p>${learnedBySpec || '<span class="hint">لا يوجد</span>'}
  </div></details>
  <details class="set" data-k="users" ${o("users")}><summary>المستخدمين والصلاحيات</summary><div class="in" id="users-in"><div class="loading">…</div></div></details>`;
  renderUsers();
}
async function renderUsers() {
  const box = $("#users-in");
  if (!box) return;
  try {
    usersCache = await api.listUsers();
  } catch (e) {
    box.innerHTML = `<div class="errors">${esc(e.message)}</div>`;
    return;
  }
  box.innerHTML = `
  <div class="table-wrap"><table class="users"><thead><tr><th>الاسم</th><th>المستخدم</th><th>الدور</th><th>يرى كل السجلات</th><th>الإحصائيات</th><th>التصدير</th><th>إدارة الاستشاريين</th><th>نشط</th></tr></thead>
  <tbody>${usersCache.map((u) => `<tr style="cursor:default">
    <td>${esc(u.name)}</td><td dir="ltr" style="text-align:end">${esc(u.username)}</td>
    <td><select data-urole="${u.uid}">${opt("user", "مستخدم", u.role === "user")}${opt("admin", "أدمن", u.role === "admin")}</select></td>
    ${["viewAll", "dashboard", "export", "consultants"].map((p) => `<td><input type="checkbox" data-uperm="${u.uid}" data-p="${p}" ${u.role === "admin" || u.perms?.[p] ? "checked" : ""} ${u.role === "admin" ? "disabled" : ""}></td>`).join("")}
    <td><input type="checkbox" data-uactive="${u.uid}" ${u.active ? "checked" : ""}></td></tr>`).join("")}</tbody></table></div>
  <p class="hint">المستخدم العادي يضيف عمليات فقط ولا يعدّل ولا يحذف. لا يمكن تغيير كلمة مرور مستخدم آخر — كل مستخدم يغيّر كلمته من زر "كلمة المرور"، ولو نسيها: أوقف الحساب وأنشئ له اسم مستخدم جديد.</p>
  <h4 style="margin:16px 0 8px">إضافة مستخدم</h4>
  <form id="user-add" class="grid">
    <div class="field"><label>الاسم</label><input type="text" name="name" required></div>
    <div class="field"><label>اسم المستخدم</label><input type="text" name="username" required autocapitalize="off"></div>
    <div class="field"><label>كلمة المرور</label><input type="text" name="password" required minlength="6"></div>
    <div class="field"><label>الدور</label><select name="role">${opt("user", "مستخدم")}${opt("admin", "أدمن")}</select></div>
    <div class="field"><label>الصلاحيات</label>
      <label><input type="checkbox" name="viewAll"> يرى كل السجلات</label>
      <label><input type="checkbox" name="dashboard"> الإحصائيات</label>
      <label><input type="checkbox" name="export"> التصدير</label>
      <label><input type="checkbox" name="consultants"> إدارة الاستشاريين</label></div>
    <div class="field" style="justify-content:end"><button class="btn">إضافة المستخدم</button></div>
  </form>`;
}
function splitInput(v) {
  return v.split(/[؛;\n]+/).map((x) => x.trim()).filter(Boolean);
}
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button, [data-open], [data-go]");
  if (!t) {
    if (!e.target.closest(".tags")) document.querySelectorAll(".sugg").forEach((s) => s.hidden = true);
    return;
  }
  const d = t.dataset;
  if (d.go) return go(d.go);
  if (d.act === "close-modal") return closeModal();
  if (d.act === "logout") {
    editingId = null;
    form = blankForm();
    return api.logout();
  }
  if (d.act === "pwd") {
    modal(`<h3 style="margin-top:0">تغيير كلمة المرور</h3><form id="pwd-form" style="display:flex;flex-direction:column;gap:10px">
      <div class="field"><label>كلمة المرور الجديدة</label><input type="password" name="p" minlength="6" required autocomplete="new-password"></div>
      <div class="field"><label>تأكيد</label><input type="password" name="p2" minlength="6" required autocomplete="new-password"></div>
      <button class="btn">حفظ</button></form>`);
    return;
  }
  if (d.chip) return setChip(d.chip, d.val);
  if (d.untag) {
    if (d.untag === "procedures") form.procClasses.splice(+d.i, 1);
    form[d.untag].splice(+d.i, 1);
    return renderEntry();
  }
  if (d.addtag) {
    const i = $(`[data-tag="${d.addtag}"]`);
    return addTag(d.addtag, i.value);
  }
  if (d.sugg) return addTag(d.sugg, d.val);
  if (d.act === "save") return saveForm();
  if (d.act === "clear") {
    if (confirm("مسح كل الخانات؟")) {
      form = blankForm({ date: form.date });
      formErrors = [];
      renderEntry();
    }
    return;
  }
  if (d.act === "cancel-edit") {
    editingId = null;
    form = blankForm();
    formErrors = [];
    return go("list");
  }
  if (d.open) {
    const o = listOps.find((x) => x.id === d.open) || (renderDaily.ops || []).find((x) => x.id === d.open);
    if (o) modal(opDetails(o));
    return;
  }
  if (d.edit) {
    const o = listOps.find((x) => x.id === d.edit) || (renderDaily.ops || []).find((x) => x.id === d.edit);
    closeModal();
    editingId = o.id;
    formErrors = [];
    form = { ...blankForm(), ...structuredClone(o) };
    form.procClasses = (form.procedures || []).map((_, i) => form.procClasses?.[i] || "");
    view = "entry";
    renderTabs();
    renderEntry();
    window.scrollTo(0, 0);
    return;
  }
  if (d.del) {
    if (!confirm("حذف هذا السجل نهائيًا؟ لا يمكن التراجع.")) return;
    try {
      await api.deleteOp(d.del);
      closeModal();
      toast("تم الحذف");
      await go(view);
    } catch (ex) {
      toast(ex.message, true);
    }
    return;
  }
  if (d.act === "xlsx") return exportXlsx(filteredList(), `عمليات_${listF.from}_${listF.to}`, listF.specialtyId);
  if (d.act === "pdf") {
    const rows = filteredList().slice().reverse();
    const cols = [["date", "اليوم"], ["time", "الوقت"], ["patientName", "اسم المريض"], ["mrn", "الرقم الطبي"], ["specialty", "التخصص"], ["consultant", "الاستشاري"], ["diagnoses", "التشخيص"], ["procedures", "العملية"], ["procClasses", "تصنيف العملية"], ["room", "الغرفة"], ["anesthesiaType", "نوع التخدير"], ["finance", "المعاملة المالية"], ["from", "قادم من"], ["to", "خروج إلى"], ["status", "الحالة"], ["postponeReason", "سبب التأجيل"]];
    return printTable(`سجل العمليات — ${settings.hospitalName}`, `من ${fmtDate(listF.from)} إلى ${fmtDate(listF.to)} — ${rows.length} سجل${listF.specialtyId ? ` — قسم ${settings.specialties.find((x) => x.id === listF.specialtyId)?.name || ""}` : ""}`, rows, cols, listF.specialtyId);
  }
  if (d.act === "print-daily") return renderDaily.print();
  if (d.act === "xlsx-daily") return exportXlsx(renderDaily.ops || [], `لستة_${dailyDate}`, dailySpec);
  if (d.preset) {
    dashF.preset = d.preset;
    return renderDash();
  }
  if (d.leDel) {
    const list = getPath(settings, d.leDel);
    if (!confirm(`حذف "${list[+d.i]}"؟`)) return;
    list.splice(+d.i, 1);
    return persist("تم الحذف");
  }
  if (d.leRen) {
    const list = getPath(settings, d.leRen);
    const v = prompt("الاسم الجديد", list[+d.i]);
    if (v && v.trim()) {
      list[+d.i] = v.trim();
      return persist();
    }
    return;
  }
  if (d.specRen) {
    const s = settings.specialties.find((x) => x.id === d.specRen);
    const v = prompt("اسم التخصص", s.name);
    if (v && v.trim()) {
      s.name = v.trim();
      return persist();
    }
    return;
  }
  if (d.specDel) {
    const s = settings.specialties.find((x) => x.id === d.specDel);
    if (!confirm(`حذف تخصص "${s.name}" بكل قوائمه؟ (السجلات القديمة لن تتأثر)`)) return;
    settings.specialties = settings.specialties.filter((x) => x.id !== s.id);
    for (const k of ["consultants", "diagnoses", "procedures"]) delete settings[k][s.id];
    return persist("تم الحذف");
  }
  if (d.catRen) {
    const c = settings.categories[+d.catRen];
    const v = prompt("الاسم", c.name);
    if (v && v.trim()) {
      c.name = v.trim();
      return persist();
    }
    return;
  }
  if (d.catDel) {
    if (!confirm(`حذف "${settings.categories[+d.catDel].name}"؟`)) return;
    settings.categories.splice(+d.catDel, 1);
    return persist("تم الحذف");
  }
  if (d.finRen) {
    const f = settings.finance[+d.finRen];
    const v = prompt("الاسم", f.name);
    if (v && v.trim()) {
      f.name = v.trim();
      return persist();
    }
    return;
  }
  if (d.finDel) {
    if (!confirm(`حذف "${settings.finance[+d.finDel].name}"؟`)) return;
    settings.finance.splice(+d.finDel, 1);
    return persist("تم الحذف");
  }
  if (d.learnDel || d.learnMove) {
    const id = d.learnDel || d.learnMove;
    const l = learned.find((x) => x.id === id);
    try {
      if (d.learnMove) {
        const key = l.type === "dx" ? "diagnoses" : "procedures";
        settings[key][l.specialtyId] = uniqueTerms([...settings[key][l.specialtyId] || [], l.text]);
        await api.saveSettings(settings);
      }
      await api.deleteLearned(id);
      learned = learned.filter((x) => x.id !== id);
      toast(d.learnMove ? "تم النقل للقائمة الرسمية" : "تم الحذف");
      renderSettings(["learned"]);
    } catch (ex) {
      toast(ex.message, true);
    }
  }
});
document.addEventListener("submit", async (e) => {
  const f = e.target;
  if (f.id === "pwd-form") {
    e.preventDefault();
    const { p, p2 } = Object.fromEntries(new FormData(f));
    if (p !== p2) return toast("كلمتا المرور غير متطابقتين", true);
    try {
      await api.changePassword(p);
      closeModal();
      toast("تم تغيير كلمة المرور");
    } catch (ex) {
      toast(ex.message, true);
    }
    return;
  }
  if (f.dataset.leAdd) {
    e.preventDefault();
    const items = splitInput(f.querySelector("input").value);
    if (!items.length) return;
    const path = f.dataset.leAdd;
    const parts = path.split(".");
    const parent = getPath(settings, parts.slice(0, -1).join(".")) || settings;
    const key = parts[parts.length - 1];
    parent[key] = uniqueTerms([...parent[key] || [], ...items]);
    return persist("تمت الإضافة");
  }
  if (f.id === "hosp-form") {
    e.preventDefault();
    settings.hospitalName = f.querySelector("input").value.trim();
    await persist();
    return renderShell();
  }
  if (f.id === "spec-add") {
    e.preventDefault();
    const name = f.querySelector("input").value.trim();
    if (!name) return;
    const id = slugId("sp");
    settings.specialties.push({ id, name });
    settings.consultants[id] = [];
    settings.diagnoses[id] = [];
    settings.procedures[id] = [];
    return persist("تمت إضافة التخصص");
  }
  if (f.id === "cat-add") {
    e.preventDefault();
    const name = f.querySelector("input").value.trim();
    if (!name) return;
    settings.categories.push({ id: slugId("cat"), name, rooms: [] });
    return persist("تمت الإضافة");
  }
  if (f.id === "fin-add") {
    e.preventDefault();
    const name = f.querySelector("input").value.trim();
    if (!name) return;
    settings.finance.push({ name, entities: false });
    return persist("تمت الإضافة");
  }
  if (f.id === "user-add") {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    const b = f.querySelector("button");
    b.disabled = true;
    try {
      await api.createUser({
        username: d.username,
        password: d.password,
        name: d.name,
        role: d.role,
        perms: { viewAll: !!d.viewAll, dashboard: !!d.dashboard, export: !!d.export, consultants: !!d.consultants }
      });
      toast("تمت إضافة المستخدم");
      renderUsers();
    } catch (ex) {
      toast(ex.message, true);
      b.disabled = false;
    }
  }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.field) {
    form[t.dataset.field] = t.value;
    return;
  }
  if (t.dataset.tag) {
    tagDraft[t.dataset.tag] = t.value;
    return showSugg(t);
  }
  if (t.dataset.lf === "q") {
    listF.q = t.value;
    clearTimeout(t._d);
    t._d = setTimeout(() => {
      renderList();
      const i = $('[data-lf="q"]');
      i.focus();
      i.setSelectionRange(i.value.length, i.value.length);
    }, 250);
  }
});
document.addEventListener("focusin", (e) => {
  if (e.target.dataset?.tag && e.target.value.trim()) showSugg(e.target);
});
document.addEventListener("focusout", (e) => {
  if (!e.target.dataset?.tag) return;
  const box = e.target.closest(".tags")?.querySelector(".sugg");
  setTimeout(() => {
    if (box && !box.contains(document.activeElement)) box.hidden = true;
  }, 200);
});
document.addEventListener("mousedown", (e) => {
  if (e.target.closest(".sugg")) e.preventDefault();
});
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t.dataset?.tag && e.key === "Enter") {
    e.preventDefault();
    const box = t.closest(".tags").querySelector(".sugg button");
    const q = t.value.trim();
    if (!q) return;
    const first = box && !box.classList.contains("new") ? box.dataset.val : null;
    addTag(t.dataset.tag, first && normalizeTerm(first).startsWith(normalizeTerm(q)) ? first : q);
  }
  if (e.key === "Escape") {
    document.querySelectorAll(".sugg").forEach((s) => s.hidden = true);
    if (!$("#modal").hidden) closeModal();
  }
});
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.dataset.field && t.tagName === "SELECT") {
    form[t.dataset.field] = t.value;
    return;
  }
  if (t.dataset.pclass !== void 0) {
    form.procClasses[+t.dataset.pclass] = t.value;
    t.classList.toggle("need", !t.value && !!rq("procClass"));
    return;
  }
  if (t.dataset.lf && t.dataset.lf !== "q") {
    listF[t.dataset.lf] = t.value;
    if (t.dataset.lf === "specialtyId") listF.consultant = "";
    if (t.dataset.lf === "from" || t.dataset.lf === "to") await loadList();
    return renderList();
  }
  if (t.dataset.df) {
    dashF[t.dataset.df] = t.value;
    return renderDash();
  }
  if (t.dataset.reqf) {
    settings.required[t.dataset.reqf] = t.checked;
    return persist(t.checked ? "أصبحت إجبارية" : "أصبحت اختيارية");
  }
  if (t.dataset.finEnt !== void 0) {
    settings.finance[+t.dataset.finEnt].entities = t.checked;
    return persist();
  }
  const uid2 = t.dataset.urole || t.dataset.uperm || t.dataset.uactive;
  if (uid2) {
    const u = usersCache.find((x) => x.uid === uid2);
    let patch;
    if (t.dataset.urole) patch = { role: t.value };
    else if (t.dataset.uperm) patch = { perms: { viewAll: false, dashboard: false, export: false, consultants: false, ...u.perms, [t.dataset.p]: t.checked } };
    else patch = { active: t.checked };
    try {
      await api.updateUser(uid2, patch);
      toast("تم الحفظ");
    } catch (ex) {
      toast(ex.message, true);
    }
    renderUsers();
  }
});
$("#modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") closeModal();
});
</script>
