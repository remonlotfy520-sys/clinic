<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C6E63">
<meta name="robots" content="noindex,nofollow">
<title>حجز العيادة - السكرتارية</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --teal:#2C6E63; --teal-d:#1F5249; --bg:#F7F4EC; --card:#fff; --line:#E7E2D3; --ink:#1c2420; --muted:#7c7466; --red:#B23B3B; --amber:#B7791F; --green:#2F855A; }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--bg); color:var(--ink); font-family:'Tajawal',Tahoma,Arial,sans-serif; font-size:16px;}
  body{min-height:100vh; padding-bottom:40px;}
  header{background:var(--teal); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:10;}
  header h1{margin:0; font-size:18px; flex:1;}
  main{max-width:640px; margin:0 auto; padding:14px 16px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px;}
  .card h2{margin:0 0 10px; font-size:16px;}
  input[type=text],input[type=tel],input[type=date],textarea{width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font:inherit; background:#fff; color:#000;}
  textarea{min-height:70px; resize:vertical;}
  input::placeholder,textarea::placeholder{color:#757575;}
  label{display:block; font-size:13px; color:var(--muted); margin:10px 0 4px;}
  .btn{display:block; width:100%; padding:13px; border:0; border-radius:10px; background:var(--teal); color:#fff; font:inherit; font-weight:700; font-size:16px; cursor:pointer; margin-top:12px;}
  .btn:disabled{opacity:.5;}
  .btn.ghost{background:#fff; color:var(--teal); border:1px solid var(--teal);}
  .row{display:flex; gap:8px;}
  .row > *{flex:1;}
  .res{display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--line); border-radius:10px; margin-top:8px; cursor:pointer; background:#fff;}
  .res:active{background:#eef6f3;}
  .res b{flex:1;}
  .res small{color:var(--muted); direction:ltr;}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
  .chip{flex:1; min-width:90px; text-align:center; padding:12px 8px; border:2px solid var(--line); border-radius:10px; cursor:pointer; background:#fff; font-weight:700;}
  .chip.sel{border-color:var(--teal); background:#e6f2ef; color:var(--teal-d);}
  .dis{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .dis .d{padding:7px 12px; border:1px solid var(--line); border-radius:999px; background:#fff; cursor:pointer; font-size:14px;}
  .dis .d.sel{background:var(--teal); border-color:var(--teal); color:#fff;}
  .dis .d.fixed{background:#eee; border-color:#ddd; color:#555; cursor:default;}
  .hint{font-size:13px; color:var(--muted); margin-top:6px;}
  .msg{padding:10px 12px; border-radius:10px; font-size:14px; margin-top:10px;}
  .msg.err{background:#fbe9e9; color:var(--red);} .msg.warn{background:#fff4de; color:var(--amber);}
  .ro{padding:10px 12px; background:#f3f1ea; border-radius:10px; color:#333; white-space:pre-wrap;}
  .q{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .q:last-child{border-bottom:0;}
  .q .n{width:28px; height:28px; border-radius:50%; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:none;}
  .q .nm{flex:1; font-weight:700;} .q .tp{font-size:12px; padding:3px 8px; border-radius:999px; background:#e6f2ef; color:var(--teal-d);}
  .q.done{opacity:.5;}
  #blocked{max-width:380px; margin:14vh auto 0; padding:0 16px; text-align:center;}
  .hidden{display:none !important;}
  .sel-box{border:2px solid var(--teal); background:#f2f9f7;}
</style>
</head>
<body>

<div id="blocked" class="hidden">
  <div class="card">
    <div style="font-size:42px;">🔒</div>
    <h2 id="blkTitle">الصفحة مقفولة</h2>
    <div class="hint" id="blkText" style="font-size:15px;"></div>
    <button class="btn ghost" id="blkRetry">🔄 جرّب تاني</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>📅 حجز العيادة <small id="todayLbl" style="font-weight:400; font-size:12px; opacity:.85;"></small></h1>
  </header>
  <main>
    <div class="card" id="searchCard">
      <h2>🔎 ابحث عن مريض</h2>
      <input type="text" id="q" placeholder="اكتب الاسم أو رقم التليفون..." autocomplete="off">
      <div id="results"></div>
      <div class="hint" id="idxInfo"></div>
      <div class="row" style="margin-top:8px;">
        <button class="btn ghost" id="btnNew" style="margin-top:0;">➕ مريض جديد</button>
        <button class="btn ghost" id="btnReload" style="margin-top:0;">🔄 تحديث القايمة</button>
      </div>
    </div>

    <div class="card sel-box hidden" id="bookCard">
      <h2 id="bkTitle">حجز</h2>

      <div id="newFields" class="hidden">
        <label>الاسم بالكامل *</label><input type="text" id="nName">
        <div class="row">
          <div><label>التليفون</label><input type="tel" id="nPhone" dir="ltr" inputmode="tel"></div>
          <div><label>السن</label><input type="text" id="nAge" inputmode="numeric"></div>
        </div>
        <div id="dupBox"></div>
      </div>

      <div id="existFields" class="hidden">
        <div id="exLoading" class="hint">جاري تحميل بيانات المريض...</div>
        <div id="exBody" class="hidden">
          <div class="row">
            <div><label>التليفون</label><div id="exPhoneBox"></div></div>
            <div><label>السن</label><div id="exAgeBox"></div></div>
          </div>
        </div>
      </div>

      <div id="infoFields" class="hidden">
        <label>ملاحظات</label>
        <div id="noteBox"></div>
        <label>التاريخ المرضي</label>
        <div class="dis" id="disBox"></div>
        <div class="row" style="margin-top:8px;">
          <input type="text" id="disOther" placeholder="مرض تاني...">
          <button class="btn ghost" id="disAdd" style="margin-top:0; flex:none; width:auto; padding:0 18px;">إضافة</button>
        </div>
      </div>

      <label style="margin-top:16px;">نوع الحجز</label>
      <div class="chips" id="types">
        <div class="chip sel" data-t="كشف">كشف</div>
        <div class="chip" data-t="استشارة">استشارة</div>
        <div class="chip" data-t="متابعة عملية">متابعة عملية</div>
      </div>
      <div class="row">
        <div><label>تاريخ الحجز</label><input type="date" id="bkDate"></div>
      </div>
      <label>ملاحظة على الحجز (اختياري)</label><input type="text" id="bkNote" maxlength="120">
      <button class="btn" id="btnBook">✅ تأكيد الحجز</button>
      <button class="btn ghost" id="btnCancel">إلغاء</button>
      <div id="bkMsg"></div>
    </div>

    <div class="card">
      <h2>📋 حجوزات اليوم <span id="qCount" class="hint"></span></h2>
      <div id="queue"><div class="hint">جاري التحميل...</div></div>
    </div>
  </main>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function norm(s){
  return String(s || '').toLowerCase()
    .replace(/[ً-ٰٟـ]/g, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/\s+/g, ' ').trim();
}
function showMsg(id, text, kind){ $(id).innerHTML = text ? `<div class="msg ${kind || 'err'}">${esc(text)}</div>` : ''; }
const DEFAULT_DISEASES = ['ضغط', 'سكر', 'قلب', 'روماتويد', 'حساسية', 'كلى', 'كبد'];

/* ---------- الاتصال بالسكريبت (الدخول بكود الـ QR، من غير باسورد) ---------- */
function lsGet(k){ try{ return localStorage.getItem(k) || ''; }catch(_){ return ''; } }
function lsSet(k, v){ try{ v ? localStorage.setItem(k, v) : localStorage.removeItem(k); }catch(_){} }
async function api(action, data){
  const url = lsGet('secUrl'), key = lsGet('secKey');
  if(!url || !key){ showBlocked('الصفحة محتاجة تتفتح من الـ QR بتاع الدكتور', 'صوّر الكود بكاميرا الموبايل.'); throw new Error('no-access'); }
  let res;
  try{ res = await fetch(url, { method:'POST', body: JSON.stringify({ action, token:key, ...(data || {}) }) }); }
  catch(_){ throw new Error('مفيش اتصال بالنت - جرّب تاني'); }
  let j; try{ j = await res.json(); }catch(_){ throw new Error('رد غير مفهوم من السيرفر'); }
  if(j && j.error === 'disabled'){ showBlocked('الوصول موقوف حاليًا', 'الدكتور أوقف الوصول للصفحة دي. اطلب منه يفعّلها.'); throw new Error('الوصول موقوف'); }
  if(j && j.error === 'unauthorized'){ lsSet('secKey', ''); showBlocked('الكود ده انتهى', 'اطلب من الدكتور كود QR جديد.'); throw new Error('الكود انتهى'); }
  if(j && j.error) throw new Error(j.error);
  return j;
}
function showBlocked(title, text){ stopPolling(); $('app').classList.add('hidden'); $('blocked').classList.remove('hidden'); $('blkTitle').textContent = title; $('blkText').textContent = text; }
function showApp(){ $('blocked').classList.add('hidden'); $('app').classList.remove('hidden'); $('todayLbl').textContent = todayStr(); loadIndex(); startPolling(); }
$('blkRetry').onclick = ()=> start();

/* ---------- قايمة المرضى (اسم + تليفون بس) ---------- */
let INDEX = [];
async function loadIndex(){
  $('idxInfo').textContent = 'جاري تحميل الأسماء...';
  try{
    const r = await api('patients');
    INDEX = (r.patients || []).map(x => ({ id:x[0], name:x[1] || '', phone:x[2] || '', n:norm(x[1]), p:String(x[2] || '').replace(/\D/g,'') }));
    $('idxInfo').textContent = INDEX.length ? ('عدد المرضى في القايمة: ' + INDEX.length) : 'القايمة فاضية';
  }catch(e){ $('idxInfo').textContent = e.message; }
  doSearch();
}
$('btnReload').onclick = loadIndex;

function doSearch(){
  const raw = $('q').value, q = norm(raw), box = $('results');
  if(!q){ box.innerHTML = ''; return; }
  const toks = q.split(' ').filter(Boolean), digits = raw.replace(/\D/g,'');
  let hits = INDEX.filter(p => toks.every(t => p.n.includes(t)) || (digits.length >= 3 && p.p.includes(digits)));
  hits.sort((a,b)=> (b.n.startsWith(q) - a.n.startsWith(q)) || a.name.localeCompare(b.name, 'ar'));
  const total = hits.length; hits = hits.slice(0, 30);
  box.innerHTML = hits.length
    ? hits.map(p => `<div class="res" data-id="${esc(p.id)}"><b>${esc(p.name)}</b><small>${esc(p.phone || 'بدون تليفون')}</small></div>`).join('') + (total > 30 ? `<div class="hint">ظاهر 30 من ${total} - اكتب أكتر عشان تحدد</div>` : '')
    : '<div class="hint" style="margin-top:8px;">مفيش نتيجة - لو مريض جديد اضغط "➕ مريض جديد"</div>';
  box.querySelectorAll('.res').forEach(el => el.onclick = ()=> startBooking(INDEX.find(p => p.id === el.dataset.id)));
}
$('q').addEventListener('input', doSearch);

/* ---------- الحجز + تسجيل البيانات ---------- */
let CUR = null;            /* {mode:'exist', p, info} أو {mode:'new'} */
let curType = 'كشف';
let DIS_FIXED = [], DIS_SEL = new Set(), DIS_EXTRA = [];
document.querySelectorAll('#types .chip').forEach(c => c.onclick = ()=>{
  document.querySelectorAll('#types .chip').forEach(x => x.classList.remove('sel')); c.classList.add('sel'); curType = c.dataset.t;
});
function renderDis(){
  const all = [...DEFAULT_DISEASES, ...DIS_EXTRA.filter(x => !DEFAULT_DISEASES.includes(x))];
  $('disBox').innerHTML = DIS_FIXED.map(d => `<span class="d fixed">✓ ${esc(d)}</span>`).join('') +
    all.filter(d => !DIS_FIXED.includes(d)).map(d => `<span class="d ${DIS_SEL.has(d) ? 'sel' : ''}" data-d="${esc(d)}">${esc(d)}</span>`).join('');
  $('disBox').querySelectorAll('.d[data-d]').forEach(el => el.onclick = ()=>{ const d = el.dataset.d; DIS_SEL.has(d) ? DIS_SEL.delete(d) : DIS_SEL.add(d); renderDis(); });
}
$('disAdd').onclick = ()=>{
  const v = $('disOther').value.trim().substr(0, 40); if(!v) return;
  if(!DIS_FIXED.includes(v)){ if(!DIS_EXTRA.includes(v) && !DEFAULT_DISEASES.includes(v)) DIS_EXTRA.push(v); DIS_SEL.add(v); }
  $('disOther').value = ''; renderDis();
};
function openBook(){
  curType = 'كشف'; document.querySelectorAll('#types .chip').forEach(x => x.classList.toggle('sel', x.dataset.t === 'كشف'));
  $('bookCard').classList.remove('hidden'); $('bkDate').value = todayStr(); $('bkNote').value = ''; showMsg('bkMsg', '');
  DIS_FIXED = []; DIS_SEL = new Set(); DIS_EXTRA = []; $('disOther').value = ''; renderDis();
  $('bookCard').scrollIntoView({behavior:'smooth', block:'start'});
}
async function startBooking(p){
  if(!p) return;
  CUR = { mode:'exist', p, info:null };
  $('bkTitle').textContent = 'حجز: ' + p.name;
  $('newFields').classList.add('hidden'); $('existFields').classList.remove('hidden'); $('infoFields').classList.add('hidden');
  $('exLoading').classList.remove('hidden'); $('exBody').classList.add('hidden');
  openBook();
  try{
    const info = await api('patientInfo', { id: p.id });
    if(!CUR || CUR.p !== p) return;
    CUR.info = info;
    $('exPhoneBox').innerHTML = info.phone ? `<div class="ro" dir="ltr">${esc(info.phone)}</div>` : '<input type="tel" id="exPhone" dir="ltr" inputmode="tel">';
    $('exAgeBox').innerHTML = info.age ? `<div class="ro">${esc(info.age)}</div>` : '<input type="text" id="exAge" inputmode="numeric">';
    $('noteBox').innerHTML = info.note ? `<div class="ro">${esc(info.note)}</div>` : '<textarea id="exNote" placeholder="ملاحظات عن المريض..."></textarea>';
    DIS_FIXED = info.chronic || []; renderDis();
    $('exLoading').classList.add('hidden'); $('exBody').classList.remove('hidden'); $('infoFields').classList.remove('hidden');
  }catch(e){ $('exLoading').textContent = e.message; }
}
$('btnNew').onclick = ()=>{
  CUR = { mode:'new' };
  $('bkTitle').textContent = 'مريض جديد';
  $('newFields').classList.remove('hidden'); $('existFields').classList.add('hidden'); $('infoFields').classList.remove('hidden');
  $('noteBox').innerHTML = '<textarea id="nNote" placeholder="ملاحظات عن المريض..."></textarea>';
  openBook();
  $('nName').value = $('q').value.trim(); $('nPhone').value = ''; $('nAge').value = ''; $('dupBox').innerHTML = '';
  checkDup();
};
$('btnCancel').onclick = ()=>{ CUR = null; $('bookCard').classList.add('hidden'); };
function checkDup(){
  const n = norm($('nName').value); if(n.length < 3){ $('dupBox').innerHTML = ''; return; }
  const toks = n.split(' ');
  const d = INDEX.filter(p => toks.every(t => p.n.includes(t))).slice(0, 5);
  $('dupBox').innerHTML = d.length ? `<div class="msg warn">⚠️ فيه أسماء شبه كده موجودة - اتأكد إنه مش مسجل قبل كده:${d.map(p => `<div class="res" data-id="${esc(p.id)}" style="background:#fff;"><b>${esc(p.name)}</b><small>${esc(p.phone)}</small></div>`).join('')}</div>` : '';
  $('dupBox').querySelectorAll('.res').forEach(el => el.onclick = ()=> startBooking(INDEX.find(p => p.id === el.dataset.id)));
}
$('nName').addEventListener('input', checkDup);

$('btnBook').onclick = async ()=>{
  if(!CUR) return;
  const btn = $('btnBook'); showMsg('bkMsg', '');
  const date = $('bkDate').value || todayStr(), note = $('bkNote').value.trim();
  const chronic = [...DIS_SEL];
  btn.disabled = true;
  try{
    let pid, name, phone;
    if(CUR.mode === 'new'){
      name = $('nName').value.trim(); phone = $('nPhone').value.trim();
      if(name.length < 3){ showMsg('bkMsg', 'اكتب الاسم بالكامل'); btn.disabled = false; return; }
      const r = await api('addPatient', { name, phone, age: $('nAge').value.trim(), note: ($('nNote') || {}).value || '', chronic });
      pid = r.id;
      INDEX.push({ id:pid, name, phone, n:norm(name), p:phone.replace(/\D/g,'') });
    } else {
      if(!CUR.info){ showMsg('bkMsg', 'استنى لحد ما بيانات المريض تتحمل'); btn.disabled = false; return; }
      pid = CUR.p.id; name = CUR.p.name; phone = CUR.info.phone;
      if(QUEUE.some(b => b.patientId === pid && b.date === date) && !confirm('المريض ده محجوز في نفس اليوم بالفعل. تحجزه تاني؟')){ btn.disabled = false; return; }
      const ph = $('exPhone') ? $('exPhone').value.trim() : '', ag = $('exAge') ? $('exAge').value.trim() : '', nt = $('exNote') ? $('exNote').value.trim() : '';
      if(ph || ag || nt || chronic.length){
        await api('fillInfo', { id: pid, phone: ph, age: ag, note: nt, chronic });
        if(ph){ phone = ph; CUR.p.phone = ph; CUR.p.p = ph.replace(/\D/g,''); }
      }
    }
    await api('book', { patientId:pid, name, phone:phone || '', type:curType, date, note });
    CUR = null; $('bookCard').classList.add('hidden'); $('q').value = ''; $('results').innerHTML = '';
    toast('✅ تم الحجز: ' + name + ' - ' + curType + (date !== todayStr() ? ' (' + date + ')' : ''));
    window.scrollTo({top:0, behavior:'smooth'});
    loadQueue();
  }catch(e){ showMsg('bkMsg', e.message); }
  btn.disabled = false;
};

let _tt = null;
function toast(t){
  let el = $('toastEl'); if(!el){ el = document.createElement('div'); el.id = 'toastEl'; el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1F5249;color:#fff;padding:12px 18px;border-radius:12px;z-index:99;max-width:90vw;text-align:center;font-weight:700;'; document.body.appendChild(el); }
  el.textContent = t; el.style.display = 'block'; clearTimeout(_tt); _tt = setTimeout(()=> el.style.display = 'none', 3500);
}

/* ---------- حجوزات اليوم (للقراءة بس) ---------- */
let QUEUE = [], _poll = null;
const STATUS = { waiting:'منتظر', in:'جوه الكشف', done:'تم' };
async function loadQueue(){
  try{
    const r = await api('bookings', { date: todayStr() });
    QUEUE = r.bookings || [];
    $('qCount').textContent = '(' + QUEUE.length + ')';
    $('queue').innerHTML = QUEUE.length
      ? QUEUE.map((b,i) => `<div class="q ${b.status === 'done' ? 'done' : ''}"><span class="n">${i+1}</span><span class="nm">${esc(b.name)}</span><span class="tp">${esc(b.type)}</span><span class="hint">${esc(STATUS[b.status] || '')}</span></div>`).join('')
      : '<div class="hint">لسه مفيش حجوزات النهارده</div>';
  }catch(e){ if(!$('app').classList.contains('hidden')) $('queue').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
}
function startPolling(){ stopPolling(); loadQueue(); _poll = setInterval(()=>{ if(!document.hidden) loadQueue(); }, 30000); }
function stopPolling(){ if(_poll){ clearInterval(_poll); _poll = null; } }

/* ---------- البداية: الدخول من الـ QR (#s=رابط السكريبت&k=كود الوصول - الجزء ده مبيتبعتش لأي سيرفر) ---------- */
async function start(){
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  if(h.get('s')) lsSet('secUrl', h.get('s'));
  if(h.get('k')) lsSet('secKey', h.get('k'));
  if(location.hash) history.replaceState(null, '', location.pathname + location.search);
  if(!lsGet('secUrl') || !lsGet('secKey')){ showBlocked('الصفحة محتاجة تتفتح من الـ QR بتاع الدكتور', 'صوّر الكود بكاميرا الموبايل.'); return; }
  try{ await api('ping'); showApp(); }
  catch(e){ if($('app').classList.contains('hidden') && $('blocked').classList.contains('hidden')) showBlocked('تعذر الاتصال', e.message); }
}
window.addEventListener('hashchange', ()=>{ if(location.hash.includes('k=')) start(); });
start();
</script>
</body>
</html>
